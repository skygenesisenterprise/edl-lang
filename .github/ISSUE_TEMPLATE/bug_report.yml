name:        "Bug Report"
description: "Create a new bug report. Have you found an unexpected behavior? Use this form."
title:       "Think about the title, twice."
labels:      ["unconfirmed"]
body:

- type: markdown
  attributes:
    value: |
      Please provide a minimal code example that reproduces the bug if possible.
      Reports with a reproducible example or detailed information will likely receive fixes faster.

- type: textarea
  id: edl-version
  attributes:
    label: EDL Compiler Version
    description: |
      Provide the compiler commit hash and how it was built. During the early
      bootstrap phase EDL is compiled by the bootstrap substrate, so include
      the output of `build/edl/edlc --help` (or the commit of the `edl/` tree
      you are using) along with your OS/architecture.
  validations:
    required: true

- type: textarea
  id: description
  attributes:
    label: Description
    description: |
      Describe the problem. Code example can be given here.
    placeholder: Bug reports with reproducible code or detailed information will be fixed faster.
  validations:
    required: true

- type: textarea
  id: current-logs
  attributes:
    label: Current Output
    description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
    placeholder: Bug reports with reproducible code or detailed information will be fixed faster.
    render: text

- type: textarea
  id: expected-logs
  attributes:
    label: Expected Output
    description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
    placeholder: Bug reports with reproducible code or detailed information will be fixed faster.
    render: text

- type: textarea
  id: known-workarounds
  attributes:
    label: Known Workarounds
    description: Provide any known workarounds.
  validations:
    required: false

- type: textarea
  id: extra-info
  attributes:
    label: Additional Information
    description: Any additional relevant information.
  validations:
    required: false

- type: markdown
  attributes:
    value: |
      - Please check whether the problem still exists on the latest commit of the `devel` branch.
      - Consider writing a PR targeting the `devel` branch after filing this; see the project's
        [contributing guide](https://github.com/skygenesisenterprise/edl-lang/blob/devel/readme.md#contributing).
      - The EDL compiler is written in a temporary bootstrap dialect while the EDL toolchain grows;
        see [specs/architecture.md](https://github.com/skygenesisenterprise/edl-lang/blob/devel/specs/architecture.md)
        for the roadmap. Bugs in the bootstrap substrate itself are tracked separately from EDL language bugs.